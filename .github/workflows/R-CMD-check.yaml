# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    # Only the Bioconductor devel job runs in a container (empty = run on the host)
    container: ${{ matrix.config.image }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          # Windows build disabled due to upstream bug with Quarto vignettes
          # See: https://github.com/rstudio/rstudio/issues/15805
          # - {os: windows-latest, r: 'release'}
          # Bioconductor devel is checked in the official Bioconductor devel
          # image. Plain R-devel installs a mix of Bioconductor release and
          # devel packages that do not work together (e.g. xcms release with a
          # newer MSnbase, where fData() is defunct).
          - {os: ubuntu-latest,   r: 'bioc-devel', image: 'bioconductor/bioconductor_docker:devel'}
          - {os: ubuntu-latest,   r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      # The Bioconductor image already has R, pandoc and quarto
      - uses: r-lib/actions/setup-pandoc@v2
        if: ${{ !matrix.config.image }}

      - uses: quarto-dev/quarto-actions/setup@v2
        if: ${{ !matrix.config.image }}

      - uses: r-lib/actions/setup-r@v2
        if: ${{ !matrix.config.image }}
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          error-on: '"warning"'

      - name: Upload check logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: check-logs-${{ matrix.config.os }}-${{ matrix.config.r }}
          path: check/*.Rcheck/00*
